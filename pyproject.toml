[project]
name = "crypto-agent"
version = "0.1.0"
description = "Agent de trading crypto en mode papier : scalping court et long, tendance, arbitrage de financement."
requires-python = ">=3.9"  # le mode papier tourne en bibliothèque standard ; ccxt (modes réels) exige 3.10+
readme = "README.md"

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, pyupgrade, simplifications, compréhensions, performances, ruff
select = ["E", "F", "W", "B", "UP", "SIM", "C4", "PIE", "PERF", "RUF", "PLW", "DTZ004"]
ignore = [
    "E501",     # longueur de ligne : gérée par la relecture, pas bloquante
    "E731",     # petites lambdas nommées tolérées
    "RUF001", "RUF002", "RUF003",  # caractères français (é, ’, ×…) dans les textes et commentaires
    "PERF203",  # try/except dans les boucles réseau : voulu (une erreur ne doit pas arrêter la boucle)
    "B023",     # lambdas de boucle utilisées immédiatement
    "SIM105",   # try/except/pass explicite, plus lisible ici que contextlib.suppress
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # imports après la modification de sys.path
